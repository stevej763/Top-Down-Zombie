spring:
  application:
    name: top-down-survival
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/topdownsurvival}
    username: ${DB_USER:topdownsurvival}
    password: ${DB_PASSWORD:topdownsurvival}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  # nginx sends X-Forwarded-Proto/Host. Without them, behind TLS the browser's https Origin doesn't
  # match the http request and Spring rejects POSTs and the /ws handshake as cross-origin.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health

top-down-survival:
  # Origins allowed to call the API directly. The Vite dev server proxies /api, so this is only
  # needed when the client is served from somewhere else.
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  # The first admin portal account, created at startup while there are none.
  admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
  # Maps guests (players without an account) may play, solo only. Everything else needs an account.
  guest-maps: ${GUEST_MAPS:house}
  # SMTP for the email verification codes. With no host, emails are written to the log instead.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:Top Down Survival <noreply@localhost>}
  debug:
    # Dev only: delays every /ws message by this much in each direction, to try client prediction.
    latency-ms: ${DEBUG_LATENCY_MS:0}
