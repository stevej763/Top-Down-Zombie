<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#000000" />
    <title>Top Down Survival</title>
    <style>
      html, body {
        margin: 0; height: 100%; background: #000; overflow: hidden;
        touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      body { display: flex; align-items: center; justify-content: center; }
      canvas { display: block; }
      /* Covers the whole screen, letterbox included, so thumbs can rest in the side bars. */
      #touch { position: fixed; inset: 0; width: 100%; height: 100%; }
      /* Read by controls.ts to keep buttons clear of the notch and home indicator. */
      #safe {
        position: fixed; visibility: hidden; pointer-events: none;
        top: env(safe-area-inset-top); right: env(safe-area-inset-right);
        bottom: env(safe-area-inset-bottom); left: env(safe-area-inset-left);
      }
      /* Brings up the phone keyboard for the name and room-code fields; kept on screen but invisible. */
      #keyboard {
        position: fixed; left: 0; top: 0; width: 1px; height: 1px; opacity: 0;
        border: 0; padding: 0; font-size: 16px; /* 16px stops iOS zooming in */
      }
      #rotate {
        display: none; position: fixed; inset: 0; background: #000; color: #ddd;
        font: 18px monospace; align-items: center; justify-content: center; text-align: center; padding: 24px;
      }
      @media (orientation: portrait) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <canvas id="touch"></canvas>
    <div id="safe"></div>
    <input id="keyboard" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" />
    <div id="rotate">Turn your phone sideways to play</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
