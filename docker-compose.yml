name: top-down-survival

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: topdownsurvival
      POSTGRES_USER: topdownsurvival
      POSTGRES_PASSWORD: ${DB_PASSWORD:-topdownsurvival}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topdownsurvival -d topdownsurvival"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: top-down-survival-server
    environment:
      # Set in a .env file to enable PUT /api/maps/{id}.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      DB_URL: jdbc:postgresql://db:5432/topdownsurvival
      DB_USER: topdownsurvival
      DB_PASSWORD: ${DB_PASSWORD:-topdownsurvival}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    image: top-down-survival
    ports:
      - "8551:80"
    depends_on:
      - server
    restart: unless-stopped

  # The admin portal (map editor). Saving needs ADMIN_TOKEN set for the server.
  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    image: top-down-survival-admin
    ports:
      - "8552:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  db-data:
