server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite fingerprints bundled assets, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Soundtrack files are large and rarely change.
    location /audio/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # The Spring Boot server. Resolved per request through Docker's DNS, so the game still loads
    # (and falls back to local scores) when the server is down. /ws is the game socket.
    # $http_host keeps the port, so Spring's same-origin check matches the browser's Origin.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://server:8080;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
